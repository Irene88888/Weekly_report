<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>內銷週報</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14303F; --ink-2:#4B6270; --paper:#F2F5F6; --card:#FFFFFF; --line:#D3DCE0;
  --late:#B4412F; --late-bg:#F6E3DF; --warn:#B07A12; --warn-bg:#F7EDD6;
  --ok:#3D7D60; --ok-bg:#E0EFE7; --irr:#6E7F88; --irr-bg:#E6EBED; --sel:#14303F; --bar:#2F6F8F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#E4ECEF; --ink-2:#9FB2BB; --paper:#0F1E26; --card:#162A34; --line:#2A414C;
  --late:#E58B78; --late-bg:#3A221E; --warn:#E2B85C; --warn-bg:#3A301A;
  --ok:#7CC2A0; --ok-bg:#1C3429; --irr:#9AAAB2; --irr-bg:#23343C; --sel:#E4ECEF; --bar:#6FB3D2;}}
:root[data-theme="dark"]{
  --ink:#E4ECEF; --ink-2:#9FB2BB; --paper:#0F1E26; --card:#162A34; --line:#2A414C;
  --late:#E58B78; --late-bg:#3A221E; --warn:#E2B85C; --warn-bg:#3A301A;
  --ok:#7CC2A0; --ok-bg:#1C3429; --irr:#9AAAB2; --irr-bg:#23343C; --sel:#E4ECEF; --bar:#6FB3D2;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:15px;line-height:1.6;font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:32px 20px 64px}
header h1{font-size:28px;font-weight:700;margin:0 0 4px;letter-spacing:.02em}
header p{margin:0;color:var(--ink-2)}
section{margin-top:40px}
h2{font-size:19px;margin:0 0 14px;display:flex;align-items:baseline;gap:10px}
h2 .no{font-size:13px;font-weight:700;color:var(--paper);background:var(--ink);border-radius:4px;padding:1px 7px}
.sub{color:var(--ink-2);margin:0 0 14px;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.card .lbl{font-size:13px;color:var(--ink-2)}
.card .val{font-size:30px;font-weight:700;line-height:1.25;margin-top:4px}
.card .val small{font-size:15px;font-weight:500;margin-left:2px}
.card .note{font-size:13px;color:var(--ink-2);margin-top:4px}
.card.key{border-color:var(--ink)}
.chg-neg{color:var(--late)} .chg-pos{color:var(--ok)}
.progress{position:relative;height:10px;border-radius:5px;background:var(--paper);margin-top:12px;overflow:visible}
.progress i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--bar)}
.progress b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);margin-top:6px}
.lead{background:var(--card);border-left:4px solid var(--ink);border-radius:0 10px 10px 0;padding:12px 16px;margin:0 0 16px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.filters button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:4px 13px;border-radius:999px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--sel);color:var(--paper);border-color:var(--sel)}
.filters button:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
.scroll{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%}
#pvTbl{min-width:760px}
th,td{padding:8px 11px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--ink-2);font-size:13px}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right}
tr.total td{font-weight:700;background:var(--paper)}
tr.sub td{font-weight:700}
tr.cust-first td{border-top:2px solid var(--line)}
.tag{display:inline-block;padding:1px 9px;border-radius:999px;font-size:13px;font-weight:500}
.t-持平{color:var(--ink-2);background:var(--paper)}
.t-全數停購,.t-停單{color:var(--late);background:var(--late-bg)}
.t-部份停購{color:var(--late);background:var(--card);box-shadow:inset 0 0 0 1px var(--late)}
.t-減量,.t-下滑{color:var(--warn);background:var(--warn-bg)}
.t-增量,.t-成長,.t-首次交易{color:var(--ok);background:var(--ok-bg)}
.t-新增品項,.t-新出貨客戶,.t-新出貨,.t-價格變動{color:var(--irr);background:var(--irr-bg)}
.neg{color:var(--late)} .pos{color:var(--ok)}
.two{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:12px;margin-bottom:16px;align-items:start}
@media (max-width:760px){.two{grid-template-columns:1fr}}
#pvSum tbody tr[data-attr]{cursor:pointer}
#pvSum tbody tr[data-attr]:hover td{background:var(--paper)}
#pvSum tbody tr[aria-pressed="true"] td{background:var(--paper);box-shadow:inset 0 -2px 0 var(--ink)}
#pvSum tbody tr[data-attr]:focus-visible{outline:2px solid var(--warn);outline-offset:-2px}
.cap{caption-side:top;text-align:left;padding:10px 11px 0;font-size:13px;color:var(--ink-2)}
.cap strong{color:var(--ink)}
.cap button{font:inherit;font-size:12px;margin-left:8px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);border-radius:999px;padding:0 9px;cursor:pointer}
tr.recon td{color:var(--ink-2);border-top:1px dashed var(--line)}
footer{margin-top:48px;color:var(--ink-2);font-size:13px;max-width:76ch}
footer p{margin:0 0 6px}
.empty{padding:18px;color:var(--ink-2)}
@media (max-width:600px){header h1{font-size:23px}.card .val{font-size:26px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>內銷週報</h1>
    <p id="meta"></p>
  </header>

  <section>
    <h2><span class="no">1</span>本週銷售額</h2>
    <div class="cards" id="weekCards"></div>
  </section>

  <section>
    <h2><span class="no">2</span>月銷售額與完成率</h2>
    <div class="cards" id="monthCards"></div>
  </section>

  <section>
    <h2><span class="no">3</span>本週客戶動態：價量分析</h2>
    <p class="lead" id="pvLead"></p>
    <nav class="filters" id="repFilter" aria-label="依業務篩選"></nav>
    <div class="two">
      <div class="scroll"><table id="pvSum"></table></div>
      <div class="scroll"><table id="custSum"></table></div>
    </div>
    <div class="scroll"><table id="pvTbl"></table></div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
const DATA = /*__DATA__*/null;
const H = DATA.head, PV = DATA.pv;
let rep = "全部", attr = null;

const esc = s => String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const wan = n => (n/1e4).toLocaleString("zh-TW",{minimumFractionDigits:1,maximumFractionDigits:1});
const yuan = n => Math.round(n).toLocaleString("zh-TW");
const pctTxt = (a,b) => b ? ((a/b-1)*100) : null;
const chg = v => v === null ? "—" : `<span class="${v<0?"chg-neg":"chg-pos"}">${v>0?"+":""}${v.toFixed(1)}%</span>`;
const sgn = n => n < 0 ? `<span class="neg">${yuan(n)}</span>` : n > 0 ? `<span class="pos">+${yuan(n)}</span>` : "0";
const num = v => v === null ? "—" : v.toLocaleString("zh-TW",{maximumFractionDigits:2});
const tag = s => `<span class="tag t-${s}">${s}</span>`;
const card = (lbl,val,note,cls="") => `<div class="card ${cls}"><div class="lbl">${lbl}</div><div class="val">${val}</div>${note?`<div class="note">${note}</div>`:""}</div>`;

function renderHead(){
  document.getElementById("meta").textContent = `資料截止 ${DATA.ref}｜內銷（新台幣）`;
  const w = pctTxt(H.tw, H.lw);
  document.getElementById("weekCards").innerHTML =
    card(`本週銷售額（${H.tw_range}）`, `${wan(H.tw)}<small>萬</small>`, `${yuan(H.tw)} 元`, "key") +
    card(`上週銷售額（${H.lw_range}）`, `${wan(H.lw)}<small>萬</small>`, `${yuan(H.lw)} 元`) +
    card("變動比例", chg(w), `${H.tw>=H.lw?"增加":"減少"} ${wan(Math.abs(H.tw-H.lw))} 萬`);

  const rate = H.target ? H.mtd/H.target : 0, time = H.days_passed/H.days_in_month;
  const prog = `<div class="progress" role="img" aria-label="完成率 ${(rate*100).toFixed(1)}%，時間進度 ${(time*100).toFixed(0)}%">
      <i style="width:${Math.min(rate,1)*100}%"></i><b style="left:${time*100}%"></b></div>
    <div class="legend"><span>完成 ${(rate*100).toFixed(1)}%</span><span>時間進度 ${(time*100).toFixed(0)}%（${H.days_passed}/${H.days_in_month} 天）</span></div>`;
  document.getElementById("monthCards").innerHTML =
    card(`本月累計銷售額（${H.mtd_range}）`, `${wan(H.mtd)}<small>萬</small>`, `${yuan(H.mtd)} 元`, "key") +
    card(`上月銷售額（${H.pm_label}）`, `${wan(H.pm)}<small>萬</small>`, `${yuan(H.pm)} 元`) +
    card(`去年同月銷售額（${H.ly_label}）`, `${wan(H.ly_month)}<small>萬</small>`, `${yuan(H.ly_month)} 元`) +
    `<div class="card"><div class="lbl">完成率</div><div class="val">${(rate*100).toFixed(1)}<small>%</small></div>
      <div class="note">基準：${esc(H.target_basis)} ${wan(H.target)} 萬</div>${prog}</div>`;
}

const REPS = [...new Set(PV.rows.map(r => r.rep))]
  .sort((a,b) => PV.rows.filter(r=>r.rep===a).reduce((s,r)=>s+r.diff,0) - PV.rows.filter(r=>r.rep===b).reduce((s,r)=>s+r.diff,0));

function renderPV(){
  const rows = rep === "全部" ? PV.rows : PV.rows.filter(r => r.rep === rep);
  const items = rows.flatMap(r => r.items);
  const total = items.reduce((a,x) => a + x.diff, 0);
  const priceTot = items.reduce((a,x) => a + x.price, 0);
  const amt = a => items.filter(x => x.attr === a).reduce((s,x) => s + x.diff - x.price, 0);
  const cnt = a => items.filter(x => x.attr === a).length;
  const stTag = r => r.status === "新出貨" ? (r.first ? tag("首次交易") : tag("新出貨")) : r.status === "持平" ? "" : tag(r.status);

  // 摘要說明（全部業務）
  const all = PV.rows, allItems = all.flatMap(r=>r.items);
  const grp = f => { const l = all.filter(f); return [l.length, l.reduce((s,r)=>s+r.diff,0), l]; };
  const [nDown, vDown] = grp(r => r.diff < 0), [nStop] = grp(r => r.status === "停單");
  const [nUp, vUp] = grp(r => r.status === "成長"), [nNew, vNew, lNew] = grp(r => r.status === "新出貨");
  const firsts = lNew.filter(r => r.first);
  const net = all.reduce((s,r)=>s+r.diff,0), allPrice = allItems.reduce((a,x)=>a+x.price,0);
  const stopV = allItems.filter(x=>x.attr==="全數停購"||x.attr==="部份停購").reduce((s,x)=>s+x.diff,0);
  document.getElementById("pvLead").innerHTML = all.length ?
    `本週出貨客戶 <strong>${PV.cust_tw}</strong> 家，上週 <strong>${PV.cust_lw}</strong> 家；兩週有交易的客戶共 <strong>${all.length}</strong> 家，淨變化 <strong>${net<0?"":"+"}${wan(net)} 萬</strong>。<br>
     銷售額下滑 <strong>${nDown}</strong> 家，合計減少 <strong>${wan(-vDown)} 萬</strong>（其中整週停單 ${nStop} 家；停購品項佔下滑 ${vDown?(stopV/vDown*100).toFixed(0):0}%）；
     成長 <strong>${nUp}</strong> 家，增加 ${wan(vUp)} 萬；新出貨 <strong>${nNew}</strong> 家，增加 ${wan(vNew)} 萬${firsts.length?`，其中首次交易：${firsts.map(r=>`<strong>${esc(r.c)}</strong>（${esc(r.rep)}，${wan(r.s1)} 萬）`).join("、")}`:""}。
     價格影響 ${allPrice===0?"為 0（同品項單價未變動）":wan(allPrice)+" 萬"}。`
    : "本週與上週都沒有交易客戶。";

  // 業務篩選
  const f = document.getElementById("repFilter");
  f.innerHTML = ["全部",...REPS].map(p => `<button type="button" aria-pressed="${p===rep}" data-rep="${esc(p)}">${esc(p)}</button>`).join("");
  f.onclick = e => { const b = e.target.closest("button"); if(!b) return; rep = b.dataset.rep; renderPV(); };

  // 歸因彙總（點選列可在右方篩選客戶）
  const ATTRS = ["全數停購","部份停購","減量","增量","新增品項","新出貨客戶"];
  const matchItem = (x,a) => a === "價格變動" ? (x.q0 > 0 && x.q1 > 0) : x.attr === a;
  const custOf = a => rows.filter(r => r.items.some(x => matchItem(x,a)));
  const row = (a,n,v) => `<tr data-attr="${a}" tabindex="0" role="button" aria-pressed="${attr===a}">
    <td>${tag(a)}</td><td class="num">${custOf(a).length}</td><td class="num">${n}</td><td class="num">${sgn(v)}</td></tr>`;
  let s = `<thead><tr><th>歸因</th><th class="num">家數</th><th class="num">品項數</th><th class="num">變化金額</th></tr></thead><tbody>`;
  ATTRS.forEach(a => s += row(a, cnt(a), amt(a)));
  s += row("價格變動", items.filter(x=>x.q0>0&&x.q1>0).length, priceTot);
  s += `<tr class="total"><td>淨變化</td><td class="num">${rows.length}</td><td class="num">${items.length}</td><td class="num">${sgn(total)}</td></tr>`;
  // 對帳：加回排除客戶＝第1段本週銷售額變化（僅在「全部」業務時顯示）
  const EX = PV.excluded || [];
  if (rep === "全部" && EX.length) {
    const exV = EX.reduce((a,r)=>a+r.s1-r.s0,0);
    s += `<tr class="recon"><td>排除客戶<br><small>${EX.map(r=>esc(r.c)).join("、")}</small></td><td></td><td></td><td class="num">${sgn(exV)}</td></tr>
      <tr class="total"><td>本週銷售額變化<br><small>＝第 1 段</small></td><td></td><td></td><td class="num">${sgn(total+exV)}</td></tr>`;
  }
  s += `</tbody>`;
  const ps = document.getElementById("pvSum");
  ps.innerHTML = rows.length ? s : `<tbody><tr><td class="empty">沒有交易客戶。</td></tr></tbody>`;
  const pickAttr = tr => { if (!tr) return; attr = attr === tr.dataset.attr ? null : tr.dataset.attr; renderPV(); };
  ps.onclick = e => pickAttr(e.target.closest("tr[data-attr]"));
  ps.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pickAttr(e.target.closest("tr[data-attr]")); } };

  // 客戶彙總（依點選的歸因篩選）
  let c;
  if (attr) {
    const list = custOf(attr);
    const part = r => r.items.filter(x => matchItem(x,attr));
    const val = r => attr === "價格變動" ? part(r).reduce((s,x)=>s+x.price,0) : part(r).reduce((s,x)=>s+x.diff-x.price,0);
    const sorted = [...list].sort((a,b) => Math.abs(val(b))-Math.abs(val(a)));
    c = `<caption class="cap">${tag(attr)}　共 <strong>${list.length}</strong> 家客戶<button type="button" id="clearAttr">顯示全部</button></caption>
      <thead><tr><th>客戶</th><th>業務</th><th>品項</th><th class="num">${esc(attr)}金額</th></tr></thead><tbody>`;
    sorted.forEach(r => c += `<tr><td>${esc(r.c)} ${stTag(r)}</td><td>${esc(r.rep)}</td>
      <td>${part(r).map(x=>esc(x.item)).join("、")}</td><td class="num">${sgn(val(r))}</td></tr>`);
    const tv = sorted.reduce((s,r)=>s+val(r),0);
    c += sorted.length ? `<tr class="total"><td>合計 ${sorted.length} 家</td><td></td><td></td><td class="num">${sgn(tv)}</td></tr>`
                       : `<tr><td colspan="4" class="empty">沒有屬於這個歸因的客戶。</td></tr>`;
  } else {
    c = `<caption class="cap">點選左方歸因，可篩選出相關客戶</caption>
      <thead><tr><th>客戶</th><th>業務</th><th class="num">上週</th><th class="num">本週</th><th class="num">變化</th><th class="num">%</th></tr></thead><tbody>`;
    rows.forEach(r => c += `<tr><td>${esc(r.c)} ${stTag(r)}</td><td>${esc(r.rep)}</td><td class="num">${yuan(r.s0)}</td>
      <td class="num">${yuan(r.s1)}</td><td class="num">${sgn(r.diff)}</td><td class="num">${chg(pctTxt(r.s1,r.s0))}</td></tr>`);
    if (rows.length) {
      const s0=rows.reduce((a,r)=>a+r.s0,0), s1=rows.reduce((a,r)=>a+r.s1,0);
      c += `<tr class="total"><td>合計 ${rows.length} 家</td><td></td><td class="num">${yuan(s0)}</td><td class="num">${yuan(s1)}</td><td class="num">${sgn(s1-s0)}</td><td class="num">${chg(pctTxt(s1,s0))}</td></tr>`;
    }
  }
  document.getElementById("custSum").innerHTML = c + "</tbody>";
  const clr = document.getElementById("clearAttr");
  if (clr) clr.onclick = () => { attr = null; renderPV(); };

  // 品項明細
  let h = `<thead><tr><th>客戶</th><th>業務</th><th>品項</th><th class="num">上週量</th><th class="num">本週量</th>
    <th class="num">上週金額</th><th class="num">本週金額</th>
    <th class="num">變化金額</th><th>歸因</th></tr></thead><tbody>`;
  rows.forEach(r => {
    r.items.forEach((x,i) => h += `<tr class="${i===0?"cust-first":""}"><td>${i===0?`<strong>${esc(r.c)}</strong> ${stTag(r)}`:""}</td><td>${i===0?esc(r.rep):""}</td>
      <td>${esc(x.item)}</td><td class="num">${x.q0?num(x.q0)+" "+esc(x.unit):"—"}</td><td class="num">${x.q1?num(x.q1)+" "+esc(x.unit):"—"}</td>
      <td class="num">${yuan(x.s0)}</td><td class="num">${yuan(x.s1)}</td>
      <td class="num">${sgn(x.diff)}</td><td>${tag(x.attr)}</td></tr>`);
    if (r.items.length > 1) h += `<tr class="sub"><td></td><td></td><td>小計</td><td></td><td></td>
      <td class="num">${yuan(r.s0)}</td><td class="num">${yuan(r.s1)}</td><td class="num">${sgn(r.diff)}</td><td></td></tr>`;
  });
  if (!rows.length) h += `<tr><td colspan="9" class="empty">沒有交易客戶。</td></tr>`;
  document.getElementById("pvTbl").innerHTML = h + "</tbody>";
}

function renderFoot(){
  document.getElementById("foot").innerHTML = `
    <p>${DATA.exclude.length ? `第 1、2 段為全體內銷銷售額；第 3 段排除：${DATA.exclude.map(esc).join("、")}。` : "三段皆為全體內銷銷售額，第 3 段淨變化即等於第 1 段本週銷售額變化。"}</p>
    <p>本週、上週為完整一週（週一～週五），取截止日當天或之前最近的週五為本週結束日；本月累計為當月 1 日至截止日。完成率＝本月累計÷${esc(H.target_basis)}，進度條上的直線為時間進度。</p>
    <p>客戶動態列出本週或上週有交易的全部客戶，依變化金額由減少到增加排序；標籤：停單＝本週完全沒出貨、下滑、成長、新出貨＝上週沒出貨本週有出貨（首次交易＝過去從未交易）。</p>
    <p>點選歸因彙總中的任一列，右方會列出有該歸因品項的客戶；再點一次或按「顯示全部」可取消。價格變動列出兩週都有購買同品項的客戶。</p>
    <p>價量分析：全數停購＝客戶本週完全沒出貨，上週買的品項都算在這裡；部份停購＝客戶本週仍有出貨，但某些上週有買的品項沒再買；減量＝同品項少買；新增品項＝老客戶本週多買的新品項；新出貨客戶＝上週整週沒出貨的客戶本週買的品項；增量＝同品項多買。價格變動＝（本週單價－上週單價）×本週量，只計兩週都有買的品項，減量金額已扣除價格影響。單價變動的影響彙總於歸因表的「價格變動」列。</p>`;
