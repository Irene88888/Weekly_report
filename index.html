<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>內銷客戶追蹤週報</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14303F; --ink-2:#4B6270; --paper:#F2F5F6; --card:#FFFFFF; --line:#D3DCE0;
  --late:#B4412F; --late-bg:#F6E3DF; --warn:#B07A12; --warn-bg:#F7EDD6;
  --ok:#3D7D60; --ok-bg:#E0EFE7; --irr:#6E7F88; --irr-bg:#E6EBED; --sel:#14303F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#E4ECEF; --ink-2:#9FB2BB; --paper:#0F1E26; --card:#162A34; --line:#2A414C;
  --late:#E58B78; --late-bg:#3A221E; --warn:#E2B85C; --warn-bg:#3A301A;
  --ok:#7CC2A0; --ok-bg:#1C3429; --irr:#9AAAB2; --irr-bg:#23343C; --sel:#E4ECEF;}}
:root[data-theme="dark"]{
  --ink:#E4ECEF; --ink-2:#9FB2BB; --paper:#0F1E26; --card:#162A34; --line:#2A414C;
  --late:#E58B78; --late-bg:#3A221E; --warn:#E2B85C; --warn-bg:#3A301A;
  --ok:#7CC2A0; --ok-bg:#1C3429; --irr:#9AAAB2; --irr-bg:#23343C; --sel:#E4ECEF;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:15px;line-height:1.6;font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:32px 20px 64px}
header h1{font-size:28px;font-weight:700;margin:0 0 6px;letter-spacing:.02em}
header p{margin:0;color:var(--ink-2)}
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);
  padding:14px 0;margin:20px 0 8px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px}
.filters button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:6px 14px;border-radius:999px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--sel);color:var(--paper);border-color:var(--sel)}
.filters button:focus-visible,.tabs button:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
section{margin-top:40px}
h2{font-size:20px;margin:0 0 4px}
.sub{color:var(--ink-2);margin:0 0 16px;font-size:14px}
.scroll{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--ink-2);font-size:13px;background:var(--card);position:sticky;top:0}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right}
tr.total td{font-weight:700}
tr.rep-first td{border-top:2px solid var(--line)}
td.rep{font-weight:700}
.tag{display:inline-block;padding:1px 9px;border-radius:999px;font-size:13px;font-weight:500}
.t-逾期,.t-停單{color:var(--late);background:var(--late-bg)}
.t-注意,.t-量下滑{color:var(--warn);background:var(--warn-bg)}
.t-正常,.t-持平／成長{color:var(--ok);background:var(--ok-bg)}
.t-不定期,.t-新增／回流{color:var(--irr);background:var(--irr-bg)}
.tabs{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:14px;border:none;background:none;color:var(--ink-2);
  padding:4px 2px;margin-right:12px;cursor:pointer;border-bottom:2px solid transparent}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
footer{margin-top:48px;color:var(--ink-2);font-size:13px;max-width:72ch}
footer p{margin:0 0 6px}
.empty{padding:20px;color:var(--ink-2)}
@media (max-width:600px){header h1{font-size:23px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>內銷客戶追蹤週報</h1>
    <p id="meta"></p>
  </header>

  <nav class="filters" id="repFilter" aria-label="依業務篩選"></nav>

  <section>
    <h2>本週客戶動態</h2>
    <p class="sub" id="weekSub"></p>
    <div class="scroll"><table id="sumTbl"></table></div>
  </section>

  <section>
    <h2>客戶明細</h2>
    <p class="sub">每家客戶以其主要交易單位判斷狀態；有多種單位者一併列出。</p>
    <div class="scroll"><table id="detTbl"></table></div>
  </section>

  <section>
    <h2>下單節奏</h2>
    <p class="sub" id="cycSub"></p>
    <div class="tabs" id="stFilter" role="group" aria-label="依狀態篩選"></div>
    <div class="scroll"><table id="cycTbl"></table></div>
  </section>

  <section>
    <h2>不定期大客戶</h2>
    <p class="sub">今年下單不到 4 次、營收 60 萬以上，沒有固定週期，依未下單天數列出。</p>
    <div class="scroll"><table id="irrTbl"></table></div>
  </section>

  <footer>
    <p>下單週期：今年各次下單日之間相隔天數的中位數，代表這家客戶平常多久下一次單。</p>
    <p>狀態：未下單天數在一個週期內為正常，超過一個週期為注意，超過兩個週期為逾期。</p>
    <p id="excl"></p>
  </footer>
</div>

const ORDER_C = {"逾期":0,"注意":1,"正常":2};
let rep = "全部", st = "全部";

const repTotals = {};
DATA.cycles.forEach(r => repTotals[r.rep] = (repTotals[r.rep]||0) + r.amt);
DATA.weekly.forEach(r => repTotals[r.rep] = repTotals[r.rep] || 0);
const REPS = Object.keys(repTotals).sort((a,b) => repTotals[b]-repTotals[a]);

const esc = s => String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const tag = s => `<span class="tag t-${s}">${s}</span>`;
const wan = n => n.toLocaleString("zh-TW");
const pick = rows => rep === "全部" ? rows : rows.filter(r => r.rep === rep);

function grouped(rows, sorter, rowHtml){
  let html = "", prev = null;
  REPS.forEach(p => {
    const g = rows.filter(r => r.rep === p).sort(sorter);
    g.forEach((r,i) => {
      html += `<tr class="${i===0 && prev ? "rep-first":""}"><td class="rep">${i===0?esc(p):""}</td>${rowHtml(r)}</tr>`;
    });
    if (g.length) prev = p;
  });
  return html;
}

function renderMeta(){
  const w = DATA.week;
  document.getElementById("meta").textContent =
    `資料截止 ${DATA.ref}；上週 ${w.lw}（出貨 ${w.lw_days} 天），本週 ${w.tw}（出貨 ${w.tw_days} 天）`;

    "上週有出貨的客戶中，本週停單或出貨量變少的比例。";
  document.getElementById("cycSub").textContent =
    `統計期間 ${DATA.cycle_range}，今年下單 4 次以上的固定往來客戶。`;

}

function renderFilters(){
  const f = document.getElementById("repFilter");
  f.innerHTML = ["全部",...REPS].map(p =>
    `<button type="button" aria-pressed="${p===rep}" data-rep="${esc(p)}">${esc(p)}</button>`).join("");
  f.onclick = e => { const b = e.target.closest("button"); if(!b) return; rep = b.dataset.rep; render(); };
  const s = document.getElementById("stFilter");
  s.innerHTML = ["全部","逾期","注意","正常"].map(x =>
    `<button type="button" aria-pressed="${x===st}" data-st="${x}">${x}</button>`).join("");
  s.onclick = e => { const b = e.target.closest("button"); if(!b) return; st = b.dataset.st; render(); };
}

function renderSummary(){
  const rows = pick(DATA.weekly);
  const reps = REPS.filter(p => rows.some(r => r.rep === p));
  const calc = list => {
    const c = k => list.filter(r => r.st === k).length;
    const prevActive = c("停單") + c("量下滑") + c("持平／成長");
    const down = c("停單") + c("量下滑");
    return {prevActive, stop:c("停單"), dec:c("量下滑"), nw:c("新增／回流"),
      pct: prevActive ? Math.round(down/prevActive*100)+"%" : "—"};
  };
  const line = (name, s, cls="") => `<tr class="${cls}"><td class="${cls?"":"rep"}">${name}</td>
    <td class="num">${s.prevActive} 家</td><td class="num">${s.prevActive?s.stop:"—"}</td>
    <td class="num">${s.prevActive?s.dec:"—"}</td><td class="num">${s.pct}</td><td class="num">${s.nw}</td></tr>`;
  let html = `<thead><tr><th>業務</th><th class="num">上週有出貨客戶</th><th class="num">本週停單</th>
    <th class="num">本週量下滑</th><th class="num">下滑比例</th><th class="num">本週新增／回流</th></tr></thead><tbody>`;
  reps.forEach(p => html += line(esc(p), calc(rows.filter(r => r.rep === p))));
  if (reps.length > 1) html += line("合計", calc(rows), "total");
  if (!reps.length) html += `<tr><td colspan="6" class="empty">這位業務兩週內沒有出貨紀錄。</td></tr>`;
  document.getElementById("sumTbl").innerHTML = html + "</tbody>";
}

  let html = `<thead><tr><th>業務</th><th>狀態</th><th>客戶</th><th>上週</th><th>本週</th><th>變化</th>
    <th class="num">上週金額</th><th class="num">本週金額</th></tr></thead><tbody>`;
  html += grouped(rows, (a,b) => ORDER_W.indexOf(a.st)-ORDER_W.indexOf(b.st) || b.lw_amt-a.lw_amt, r =>
    `<td>${tag(r.st)}</td><td>${esc(r.c)}</td><td>${esc(r.lw)}</td><td>${esc(r.tw)}</td>
     <td>${esc(r.chg)}</td><td class="num">${wan(r.lw_amt)}</td><td class="num">${wan(r.tw_amt)}</td>`);
  if (!rows.length) html += `<tr><td colspan="8" class="empty">這位業務兩週內沒有出貨紀錄。</td></tr>`;
  document.getElementById("detTbl").innerHTML = html + "</tbody>";
}

function renderCycles(){
  let rows = pick(DATA.cycles).filter(r => r.st !== "不定期");
  if (st !== "全部") rows = rows.filter(r => r.st === st);
  let html = `<thead><tr><th>業務</th><th>客戶</th><th class="num">今年下單次數</th><th class="num">下單週期(天)</th>
    <th>最後下單</th><th class="num">未下單天數</th><th>狀態</th><th class="num">今年營收(萬)</th></tr></thead><tbody>`;
  html += grouped(rows, (a,b) => ORDER_C[a.st]-ORDER_C[b.st] || b.amt-a.amt, r =>
    `<td>${esc(r.c)}</td><td class="num">${r.n}</td><td class="num">${r.cyc}</td><td>${r.last}</td>
     <td class="num">${r.since}</td><td>${tag(r.st)}</td><td class="num">${wan(r.amt)}</td>`);
  if (!rows.length) html += `<tr><td colspan="8" class="empty">沒有符合條件的客戶。</td></tr>`;
  document.getElementById("cycTbl").innerHTML = html + "</tbody>";
}

function renderIrregular(){
  const rows = pick(DATA.cycles).filter(r => r.st === "不定期");
  let html = `<thead><tr><th>業務</th><th>客戶</th><th class="num">今年下單次數</th><th>最後下單</th>
    <th class="num">未下單天數</th><th class="num">今年營收(萬)</th></tr></thead><tbody>`;
  html += grouped(rows, (a,b) => b.amt-a.amt, r =>
    `<td>${esc(r.c)}</td><td class="num">${r.n}</td><td>${r.last}</td>
     <td class="num">${r.since}</td><td class="num">${wan(r.amt)}</td>`);
  if (!rows.length) html += `<tr><td colspan="6" class="empty">沒有符合條件的客戶。</td></tr>`;
  document.getElementById("irrTbl").innerHTML = html + "</tbody>";
}

function render(){ renderFilters(); renderSummary(); renderDetail(); renderCycles(); renderIrregular(); }
renderMeta(); render();
</script>
</body>
</html>
